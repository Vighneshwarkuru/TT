############################################
# APP
############################################
spring.application.name=verdictsphere
server.port=${PORT:8080}

############################################
# DATABASE
############################################
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / HIBERNATE
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

############################################
# HIKARI POOL (Production Safe)
############################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

############################################
# JWT
############################################
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=900000

############################################
# ADMIN SEEDS
############################################
admin1.email=admin1@verdictsphere.com
admin1.password=Admin@123
admin1.firstName=Admin
admin1.lastName=One

admin2.email=admin2@verdictsphere.com
admin2.password=Admin@123
admin2.firstName=Admin
admin2.lastName=Two

admin3.email=admin3@verdictsphere.com
admin3.password=Admin@123
admin3.firstName=Admin
admin3.lastName=Three

############################################
# LOGGING
############################################
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

############################################
# GEMINI (optional — set to enable AI feedback)
############################################
gemini.api-key=${GEMINI_API_KEY:}
