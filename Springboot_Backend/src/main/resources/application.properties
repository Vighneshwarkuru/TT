############################################
# APP
############################################
spring.application.name=verdictsphere
server.port=${PORT:8080}

############################################
# DATABASE (Render + Local Compatible)
############################################
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/verdictsphere}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

############################################
# JPA / HIBERNATE (Hibernate 7 REQUIRED CONFIG)
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

############################################
# CONNECTION POOL (Hikari - Production Safe)
############################################
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

############################################
# JWT
############################################
jwt.secret=${JWT_SECRET:VerdictSphereSuperSecretKeyChangeInProduction123456}
jwt.expiration.ms=${JWT_EXPIRATION_MS:900000}

############################################
# ADMIN SEEDS
############################################
admin1.email=${ADMIN1_EMAIL:admin1@verdictsphere.com}
admin1.password=${ADMIN1_PASSWORD:Admin@123}
admin1.firstName=Admin
admin1.lastName=One

admin2.email=${ADMIN2_EMAIL:admin2@verdictsphere.com}
admin2.password=${ADMIN2_PASSWORD:Admin@123}
admin2.firstName=Admin
admin2.lastName=Two

admin3.email=${ADMIN3_EMAIL:admin3@verdictsphere.com}
admin3.password=${ADMIN3_PASSWORD:Admin@123}
admin3.firstName=Admin
admin3.lastName=Three

############################################
# LOGGING (Optional)
############################################
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework=INFO