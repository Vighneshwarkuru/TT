databases:
  - name: verdictsphere-db
    plan: free
    databaseName: verdictsphere
    user: verdictsphere

services:
  # Backend Web Service (Spring Boot - Docker)
  - type: web
    name: verdictsphere-backend
    runtime: docker
    plan: free
    rootDir: Springboot_Backend
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: verdictsphere-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: verdictsphere-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: verdictsphere-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: verdictsphere-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: verdictsphere-db
          property: password
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site (React)
  - type: web
    name: verdictsphere-frontend
    runtime: static
    rootDir: React_Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://verdictsphere-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
