services:
  # Backend Web Service (Spring Boot - Docker)
  - type: web
    name: verdictsphere-backend
    runtime: docker
    plan: free
    rootDir: Springboot_Backend
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://<host>:<port>/postgres"
      - key: SPRING_DATASOURCE_USERNAME
        value: "postgres"
      - key: SPRING_DATASOURCE_PASSWORD
        value: "password"
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site (React)
  - type: web
    name: verdictsphere-frontend
    runtime: static
    rootDir: React_Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: verdictsphere-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
