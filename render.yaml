services:
  # Backend Web Service (Spring Boot)
  - type: web
    name: verdictsphere-backend
    runtime: java
    plan: free
    rootDirectory: Springboot_Backend
    buildCommand: ./mvnw clean install -DskipTests
    startCommand: java -jar target/verdictsphere-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_DATASOURCE_URL
        placeholder: "jdbc:postgresql://<host>:<port>/postgres"
      - key: SPRING_DATASOURCE_USERNAME
        placeholder: "postgres"
      - key: SPRING_DATASOURCE_PASSWORD
        placeholder: "your-supabase-password"
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site (React)
  - type: static_site
    name: verdictsphere-frontend
    plan: free
    rootDirectory: React_Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: verdictsphere-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
